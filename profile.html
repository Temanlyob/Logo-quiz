<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile</title>

<link rel="stylesheet" href="profile.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

<header class="top">

<a href="home.html" class="back-btn">←</a>

<h1>My Profile</h1>

</header>

<section class="profile-card">

<img src="default-avatar.png" class="avatar">

<h2 id="username">Guest User</h2>

<p>Logo Quiz Player</p>

<div class="level">

⭐ Level 3

</div>

</section>

<section class="stats-grid">

<div class="stat-card">

<div class="icon">🏆</div>

<h3 id="score">180</h3>

<p>Total Score</p>

</div>

<div class="stat-card">

<div class="icon">🔥</div>

<h3 id="streak">8</h3>

<p>Current Streak</p>

</div>

<div class="stat-card">

<div class="icon">🎯</div>

<h3 id="accuracy">92%</h3>

<p>Accuracy</p>

</div>

<div class="stat-card">

<div class="icon">🧩</div>

<h3 id="played">25</h3>

<p>Puzzles Played</p>

</div>

</section>
