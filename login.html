<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Logo Quiz</title>

<link rel="stylesheet" href="login.css">

</head>

<body>

<div class="login-container">

<div class="logo-area">

<h1>Logo Quiz</h1>

<p>Welcome Back</p>

</div>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">

Log In

</button>

</form>

<button id="googleLogin">

Continue with Google

</button>

<p>

Don't have an account?

<a href="signup.html">

Create Account

</a>

</p>

</div>

<script type="module" src="login.js"></script>

</body>
</html>
