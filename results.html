<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Today's Result</title>

<link rel="stylesheet" href="results.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="result-card">

        <div id="resultIcon" class="result-icon">
            🏆
        </div>

        <h1 id="resultTitle">
            Today's Result
        </h1>

        <div class="score-box">

            <span>Score</span>

            <h2 id="scoreValue">
                +10
            </h2>

        </div>

        <div class="stats">

            <div class="stat">

                <span>🔥 Current Streak</span>

                <strong id="currentStreak">
                    0 Days
                </strong>

            </div>

            <div class="stat">

                <span>🏅 Best Streak</span>

                <strong id="bestStreak">
                    0 Days
                </strong>

            </div>

            <div class="stat">

                <span>🎯 Win Rate</span>

                <strong id="winRate">
                    0%
                </strong>

            </div>

        </div>

        <button id="calendarBtn">

            📅 View Calendar

        </button>

        <button id="homeBtn">

            🏠 Back to Home

        </button>

    </div>

</div>

<script src="results.js"></script>

</body>

</html>
