<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Today's Result</title>

<link rel="stylesheet" href="results.css?v=2">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<button id="editProfileBtn">
    ✏️ Edit Profile
</button>

<div id="editProfileModal" class="edit-profile-modal">

    <div class="edit-profile-box">

        <h2>Edit Profile</h2>

        <img
            id="editPhotoPreview"
            src="default-avatar.png"
            class="edit-photo-preview"
        >

        <input
            type="file"
            id="profilePhotoInput"
            accept="image/*"
        >

        <input
            type="text"
            id="editUsername"
            placeholder="Username"
            maxlength="30"
        >

        <button id="saveProfileBtn">
            Save Changes
        </button>

        <button id="cancelProfileBtn">
            Cancel
        </button>

    </div>

</div>

<div class="container">

    <div class="result-card">

        <div id="resultIcon" class="result-icon">
            🏆
        </div>

        <h1 id="resultTitle">
            Today's Result
        </h1>

        <div class="score-box">

            <span>Score</span>

            <h2 id="scoreValue">
                +10
            </h2>

        </div>

        <div class="stats">

            <div class="stat">

                <span>🔥 Current Streak</span>

                <strong id="currentStreak">
                    0 Days
                </strong>

            </div>

            <div class="stat">

                <span>🏅 Best Streak</span>

                <strong id="bestStreak">
                    0 Days
                </strong>

            </div>

            <div class="stat">

                <span>🎯 Win Rate</span>

                <strong id="winRate">
                    0%
                </strong>

            </div>

            <div class="stat">

    <span>🎮 Total Games</span>

    <strong id="totalGames">0</strong>

</div>

<div class="stat">

    <span>✅ Games Won</span>

    <strong id="gamesWon">0</strong>

</div>

<div class="stat">

    <span>❌ Games Lost</span>

    <strong id="gamesLost">0</strong>

</div>

        </div>

        <button id="calendarBtn">

            📅 View Calendar

        </button>

        <button id="homeBtn">

            🏠 Back to Home

        </button>

    </div>

</div>

<nav class="bottom-nav">

<a href="home.html">

🏠
<span>Home</span>

</a>

<a href="calendar.html">

📅
<span>Calendar</span>

</a>

<a href="results.html" class="active">

🏆
<span>Results</span>

</a>

<a href="profile.html">

👤
<span>Profile</span>

</a>

</nav>

<script type="module" src="results.js"></script>

</body>
</html>
