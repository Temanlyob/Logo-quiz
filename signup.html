<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account</title>

<link rel="stylesheet" href="signup.css">

</head>

<body>

<div class="signup-container">

<div class="logo-area">

<h1>Logo Quiz</h1>

<p>Create your account</p>

</div>

<form id="signupForm">

<input
type="text"
id="username"
placeholder="Username"
required>

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<button type="submit">

Create Account

</button>

</form>

<button id="googleSignup">

Continue with Google

</button>

<p>

Already have an account?

<a href="login.html">

Log In

</a>

</p>

</div>

<script type="module" src="signup.js"></script>

</body>

</html>
