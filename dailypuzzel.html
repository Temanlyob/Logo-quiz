<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Puzzle</title>

<link rel="stylesheet" href="dailypuzzel.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="top">

        <img src="logo_quiz.png" class="logo">

        <h1>

            Which one is

            <span>real?</span>

        </h1>

    </div>

    <div class="cards">

        <div class="card" id="option1">

            <img src="image1.png" class="quiz-image">

        </div>

        <div class="card" id="option2">

            <img src="image2.png" class="quiz-image">

        </div>

        <div id="resultBox" class="result-box">

<h2 id="resultTitle"></h2>

<p id="resultText"></p>

<button id="resultBtn">
Show Results
</button>

        </div>

    </div>

    <!-- Result Section (Hidden by default) -->

<div id="resultSection" class="result-section">

    <div class="result-icon">
        ✅
    </div>

    <h2 id="resultHeading">
        Correct!
    </h2>

    <p id="resultMessage">
        You selected the real logo.
    </p>

    <div class="points">
        +10 Points ⭐
    </div>

    <div class="great-job">

        <div class="trophy">
            🏆
        </div>

        <div>

            <h3>Great Job!</h3>

            <p>You have a sharp eye for details.</p>

        </div>

    </div>

    <button id="showResultsBtn">
        Show Results →
    </button>

    <a href="index.html" class="back-home">
        Back to Home
    </a>

</div>

</div>

<script src="dailypuzzel.js"></script>
    
</body>

</html>
