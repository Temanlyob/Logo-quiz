<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Logo Puzzle</title>

<link rel="stylesheet" href="dailypuzzel.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <!-- Top -->

    <header class="top">

        <img src="logo_quiz.png" class="logo">

        <h1>

            Which one is

            <span>real?</span>

        </h1>

    </header>


    <!-- Quiz -->

    <section class="cards">

        <div class="card" id="option1">

            <span class="badge" id="badge1"></span>

            <img id="img1" src="" class="quiz-image">

        </div>

        <div class="card" id="option2">

            <span class="badge" id="badge2"></span>

            <img id="img2" src="" class="quiz-image">
            
        </div>

    </section>


    <!-- Result -->

    <section class="result-section" id="resultSection">

        <div class="result-circle" id="resultCircle">

            ✅

        </div>

        <h2 id="resultTitle">

            Correct!

        </h2>

        <p id="resultText">

            You selected the correct logo.

        </p>

        <div class="points-card" id="pointsCard">

            +10 Points ⭐

        </div>


        <div class="info-card">

            <div class="info-icon">

                💡

            </div>

            <div>

                <h3 id="infoTitle">

                    Great Job!

                </h3>

                <p id="infoText">

                    You spotted the authentic logo.

                </p>

            </div>

        </div>


        <button id="showResultsBtn">

            Show Results →

        </button>


        <a href="home.html" class="back-home">

            ← Back to Home

        </a>

    </section>

</div>

<script type="module" src="dailypuzzel.js"></script>

</body>

</html>
